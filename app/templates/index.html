<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Agent Ecosystem Scanner</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">OPEN-SOURCE INTELLIGENCE</p>
      <h1>AI Agent Ecosystem Scanner</h1>
      <p>Discover MCP servers, skills, plugins, frameworks and agent tooling.</p>
      <button id="scan">Run ecosystem scan</button>
      <span id="status" role="status" aria-live="polite"></span>
    </header>
    <section>
      <h2>Repositories</h2>
      <div id="repos" class="grid"><p>Loading latest scan…</p></div>
    </section>
    <section>
      <h2>Scan history</h2>
      <div id="history" class="grid"><p>Loading scan history…</p></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
